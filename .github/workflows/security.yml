name: Security

on:
  push:
    branches: [main, "**stable**", "**testing**"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - vendor/**
      - scripts/test-miri.sh
      - .github/workflows/security.yml
      - .github/actions/install-system-deps/**
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - vendor/**
      - scripts/test-miri.sh
      - .github/workflows/security.yml
      - .github/actions/install-system-deps/**
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec vulnerabilities and unsound dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Run the scanner itself. Its result must not be replaced by a failed
      # attempt to create an extra GitHub Check using a read-only PR token.
      - run: cargo audit --deny unsound
      - name: Vendored workspace lockfile
        run: cargo audit --deny unsound --file vendor/big-rust-components/Cargo.lock

  secrets:
    name: Secret scan, including findings awaiting verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@166bf18f3a3fe52a6db9e1770568f52a0c40ff07
        with:
          version: '3.97.4'
          # An unknown result needs triage. Do not silently drop the category
          # or assume an unverified finding is either a leak or a false alarm.
          extra_args: --results=verified,unknown

  miri:
    name: Miri, deterministic data-model contracts
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Native plugin loading, real subprocesses and GTK have dedicated
      # integration jobs. Unsupported FFI is not an undefined-behavior result.
      - run: bash scripts/test-miri.sh
