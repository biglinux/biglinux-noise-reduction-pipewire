name: Security

# Changes are audited by CI. This scheduled pass detects newly published
# advisories even when neither lockfile has changed. It does not rebuild the
# application, repeat Miri or rerun the PR's secret scan.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Scheduled RustSec vulnerabilities and unsound dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny unsound
      - name: Vendored workspace lockfile
        run: cargo audit --deny unsound --file vendor/big-rust-components/Cargo.lock
