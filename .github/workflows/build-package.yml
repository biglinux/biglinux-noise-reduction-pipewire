name: Build Package

# Asks BigLinux's package builder to build the pushed branch. The builder
# fetches pkgbuild/ from this repository and the source from the branch.
on:
  push:
    branches: [main, "stable-*", "testing-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Send Hooks BigLinux Build Package
        shell: bash
        env:
          TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          PAYLOAD: '{"event_type": "${{ github.repository }}", "client_payload": { "branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}"}}'
        run: |
          curl -fsS -X POST -H "Accept: application/json" -H "Authorization: token ${TOKEN}" \
            --data "${PAYLOAD}" https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
