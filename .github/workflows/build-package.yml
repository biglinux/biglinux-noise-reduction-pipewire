name: Build Package

# The deployment hooks below are intentionally disabled. Do not start an
# empty job on every stable/testing push. Keep explicit manual access until
# the maintainer enables a real package-build integration.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Report the disabled packaging integration
        run: echo 'Package webhooks are disabled; no package was built or published.'
