name: Review workbench
# Temporary branch-scoped tooling; this file is not part of the application PR.
on:
  push:
    branches: [fix/review-audio-reliability-20260908]
    paths: [.github/review/followup/request.json]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'biglinux/biglinux-noise-reduction-pipewire' && contains(github.event.head_commit.message, '[apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: review-workbench-apply-20260908
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/review-reliability-accessibility-20260908
          path: project
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext python3-polib
      - run: cargo install xtr --version 0.1.11 --locked
      - name: Verify exact source, synchronize catalogs and publish a fast-forward
        id: publish
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ../workbench/.github/review/followup/apply.py
          cargo fmt --all --check
          git diff --check
          bash scripts/refresh-pot.sh
          /usr/bin/python3 - <<'PY'
          import json, polib
          from pathlib import Path
          request = json.loads(Path('../workbench/.github/review/followup/request.json').read_text())
          po = polib.pofile('po/pt_BR.po')
          for message, translation in request.get('translations', {}).items():
              entry = po.find(message)
              assert entry is not None, 'Missing source message: ' + message
              entry.msgstr = translation
              if 'fuzzy' in entry.flags: entry.flags.remove('fuzzy')
          po.save()
          missing = [entry.msgid for entry in po if not entry.obsolete and not entry.translated()]
          assert not missing, 'Missing Brazilian translations: ' + repr(missing)
          PY
          for po in po/*.po; do msgfmt --check --check-header -o /dev/null "$po"; done
          if ! git diff --quiet -- po; then
            git add -- po
            git commit -m 'i18n: synchronize review fixes and Brazilian guidance'
          fi
          git push origin HEAD:refs/heads/fix/review-reliability-accessibility-20260908
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -15 --oneline
  validate:
    needs: apply
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - run: pacman -Syu --noconfirm --needed git xorg-server-xvfb xorg-xauth dbus ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: review-workbench
          cache-on-failure: true
      - name: Strict Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Unit, integration and documentation regressions
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-features --locked -- --test-threads=1 2>&1 | tee /tmp/tests.log
      - name: Isolated GTK display contracts
        if: always()
        shell: bash
        run: |
          set -o pipefail
          timeout 240s bash scripts/test-ui.sh 2>&1 | tee /tmp/gtk.log
      - name: System allocator regressions
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-default-features --locked -- --test-threads=1 2>&1 | tee /tmp/system-allocator.log
      - name: Source and diagnostic evidence for the exact checkout
        if: always()
        shell: bash
        run: |
          git -c safe.directory="$PWD" rev-parse HEAD | tee /tmp/tested-commit.txt
          git -c safe.directory="$PWD" archive --format=tar.gz --output=/tmp/tested-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-native-${{ needs.apply.outputs.commit }}
          path: |
            /tmp/*.log
            /tmp/tested-commit.txt
            /tmp/tested-source.tar.gz
          retention-days: 3
  portable:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext python3-polib python3-yaml shellcheck nix-bin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      - name: Audited dependency locks
        run: |
          cargo audit --deny unsound
          cargo audit --deny unsound --file vendor/big-rust-components/Cargo.lock
      - name: License and source policy
        if: always()
        run: cargo deny check
      - name: Unused dependencies
        if: always()
        run: cargo machete --with-metadata
      - name: Shell, Nix syntax and Plasma status contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -e SC2034,SC2154
          sudo env NIX_REMOTE=local nix-instantiate --parse default.nix >/dev/null
          sudo env NIX_REMOTE=local nix-instantiate --parse flake.nix >/dev/null
          sudo env NIX_REMOTE=local nix-instantiate --parse packaging/nix/module.nix >/dev/null
          node --test tests/plasmoid_status.test.cjs
      - name: Extraction and translations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo install xtr --version 0.1.11 --locked
          bash scripts/refresh-pot.sh --check
          for po in po/*.po; do msgfmt --check --check-header -o /dev/null "$po"; done
          /usr/bin/python3 - <<'PY'
          import polib
          active = [entry for entry in polib.pofile('po/pt_BR.po') if not entry.obsolete]
          assert all(entry.translated() for entry in active)
          print(f'pt_BR: {len(active)} current messages translated')
          PY
      - name: Complexity
        if: always()
        run: pipx run lizard src/ -l rust -C 25 -w
      - name: Duplication
        if: always()
        run: npx --yes jscpd --min-lines 50 --min-tokens 100 --threshold 5 --reporters console --silent src/
      - uses: crate-ci/typos@master
        if: always()
