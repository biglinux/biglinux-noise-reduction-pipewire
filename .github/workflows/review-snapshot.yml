name: Review source snapshot
on:
  push:
    branches: [fix/review-audio-reliability-20260908]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'biglinux/biglinux-noise-reduction-pipewire'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive only the staged text payloads
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/review-transport.tar.gz" .github/review/followup/batch-02-part*.b64
          sha256sum "$RUNNER_TEMP/review-transport.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: review-transport-batch02
          path: ${{ runner.temp }}/review-transport.tar.gz
          retention-days: 1
          if-no-files-found: error
