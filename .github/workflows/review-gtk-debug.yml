name: Review GTK backtrace
on:
  push:
    branches: [fix/review-audio-reliability-20260908]
    paths: [.github/workflows/review-gtk-debug.yml]
permissions:
  contents: read
jobs:
  backtrace:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - run: pacman -Syu --noconfirm --needed git gdb xorg-server-xvfb xorg-xauth dbus ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f627f9a62df21be145476533b5ccb7ab1e69bfc4
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: review-workbench
          cache-on-failure: true
      - name: Build the exact library test executable
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-features --locked --lib --no-run --message-format=json > /tmp/compiler.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = []
          for line in Path('/tmp/compiler.jsonl').read_text().splitlines():
              item = json.loads(line)
              if item.get('reason') == 'compiler-artifact' and item.get('executable') and item.get('profile', {}).get('test'):
                  candidates.append(item['executable'])
          assert len(candidates) == 1, candidates
          Path('/tmp/test-executable').write_text(candidates[0])
          PY
      - name: Obtain a stack trace inside disposable display, DBus and XDG trees
        shell: bash
        run: |
          set -euo pipefail
          session=$(mktemp -d)
          trap 'rm -rf -- "$session"' EXIT
          mkdir -m 700 "$session/runtime" "$session/config" "$session/cache" "$session/data"
          unset DBUS_SESSION_BUS_ADDRESS PULSE_SERVER PIPEWIRE_REMOTE
          export XDG_RUNTIME_DIR="$session/runtime" XDG_CONFIG_HOME="$session/config"
          export XDG_CACHE_HOME="$session/cache" XDG_DATA_HOME="$session/data"
          export DBUS_SYSTEM_BUS_ADDRESS="unix:path=$session/no-system-bus"
          export BIGLINUX_UI_SESSION_MODE=disposable G_DEBUG=fatal-warnings
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 LANGUAGE=C GDK_BACKEND=x11 GSK_RENDERER=cairo
          timeout 180s xvfb-run -a dbus-run-session -- gdb --batch --return-child-result \
            -ex 'set pagination off' -ex 'set debuginfod enabled off' -ex run \
            -ex 'thread apply all bt 20' --args "$(cat /tmp/test-executable)" \
            ui::tests::gtk_display_contracts_cover_dialogs_and_model_picker \
            --ignored --exact --nocapture --test-threads=1 2>&1 | tee /tmp/gtk-backtrace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtk-backtrace-f627f9
          path: /tmp/gtk-backtrace.log
          retention-days: 3
