name: CI

on:
  push:
    branches: [main, "**stable**", "**testing**"]
    paths-ignore: ["**.md", "docs/**", ".github/dependabot.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check

  native:
    name: Native contracts and isolated GTK session
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - run: pacman -Syu --noconfirm --needed git xorg-server-xvfb xorg-xauth dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Strict Clippy, all targets and features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit, integration and documentation tests
        run: cargo test --all-features --locked -- --test-threads=1
      - name: Isolated graphical contracts, explicitly including ignored GUI test
        run: bash scripts/test-ui.sh
      - name: System allocator build and tests
        run: cargo test --no-default-features --locked -- --test-threads=1

  msrv:
    name: MSRV 1.97.1
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --locked

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  deny:
    name: Dependency advisories, licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete --with-metadata

  typos:
    name: Spelling and protocol-aware exceptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: crate-ci/typos@master

  complexity:
    name: Complexity and duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: pipx install lizard
      - run: npm install -g jscpd
      - run: lizard src/ -l rust -C 25 -w
      - run: jscpd --min-lines 50 --min-tokens 100 --threshold 5 --reporters console --silent src/

  i18n:
    name: Rust/QML extraction coverage and gettext catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: cargo install xtr --version 0.1.11 --locked
      - run: bash scripts/refresh-pot.sh --check
      - name: Validate every catalog
        run: |
          set -euo pipefail
          for po in po/*.po; do
            msgfmt --check --check-header -o /dev/null "$po"
          done

  flatpak-manifest:
    name: Flatpak metadata and offline source consistency, not runtime approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Parse manifest and verify registry checksums against Cargo.lock
        run: |
          /usr/bin/python3 - <<'PY'
          import json, tomllib, yaml
          from pathlib import Path
          yaml.safe_load(Path('packaging/flatpak/br.com.biglinux.microphone.yml').read_text())
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          expected = {f"cargo/vendor/{p['name']}-{p['version']}": p['checksum']
                      for p in packages if p.get('source', '').startswith('registry+')}
          sources = json.loads(Path('packaging/flatpak/cargo-sources.json').read_text())
          actual = {s['dest']: s['sha256'] for s in sources if s.get('type') == 'archive'}
          assert actual == expected, 'Regenerate cargo-sources.json after changing Cargo.lock'
          PY

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -e SC2034,SC2154 scripts/*.sh packaging/flatpak/generate-cargo-sources.sh

  dependency-review:
    name: Newly introduced dependency advisories
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
