name: CI policy validation
on:
  push:
    branches: [fix/review-audio-reliability-20260908]
    paths: [.github/workflows/ci-policy-validation.yml]
permissions:
  contents: read
concurrency:
  group: ci-policy-validation
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8b8b5a003dd44ea565e244290711d58b38387be9
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and selection policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8b8b5a003dd44ea565e244290711d58b38387be9
          python3 -m unittest discover -v -s .github/ci -p 'test_*.py'
      - name: Check workflow syntax and shell contracts
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color .github/workflows/ci.yml .github/workflows/security.yml
          bash -n scripts/test-ui.sh scripts/test-pipewire.sh
          shellcheck scripts/test-ui.sh scripts/test-pipewire.sh
      - name: Report checked revision
        if: always()
        run: git rev-parse HEAD
