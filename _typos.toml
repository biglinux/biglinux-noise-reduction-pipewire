[default]
extend-ignore-identifiers-re = [
    # LADSPA plugin identifiers
    "gverb",
    "sc4m",
    # Audio processing
    "hpf",
    "DNS3",
    "VCTK",
    # DFN plugin control ports, as named by dfn3-ladspa: PN_A0..PN_A9.
    "PN_A\\d",
    # PipeWire CLI tools
    "wpctl",
    # KDE i18n function: typos splits "i18nd" into "i18" + "nd".
    "i18nd?",
    # MPRIS specifies the signal name Seeked; do not rename the protocol.
    "[Ss]eeked",
    "seeked_position",
    "emit_seeked",
]

# Words typos flags but are valid in our context.
[default.extend-words]
# Portuguese for "sound" — appears in pt_BR translations.
som = "som"
# Relm4 GTK application framework.
relm = "relm"
Relm = "Relm"
# Intel High Definition Audio.
HDA = "HDA"
# GTK terminology and percent-encoded café fixture.
unparented = "unparented"
caf = "caf"

[files]
extend-exclude = [
    # Localized prose is not English; gettext catalogs have a separate gate.
    # Keep English docs, Rust code, protocol identifiers and fixtures checked.
    "docs/*.pt_BR.md",
    # Research notes are written in Portuguese.
    "docs/research/**",
    # Portuguese working notes and external review bundles. The bundles carry
    # their own .patch copies of code this gate already reads at its source.
    "ANALISE-*.md",
    "PLANO-*.md",
    "DENOISE-*.md",
    "DPDFNET-*.md",
    "BIGLINUX-*.md",
    "target/**",
    "po/**/*.po",
    "po/*.pot",
    "build-locale/**",
    "*.mo",
    "*.svg",
    # Plasma plasmoid QML/JSON — ships pt_BR translations and uses
    # KLocalizedString helper names (i18nd) that confuse the tokenizer.
    "usr/share/plasma/**",
    # WirePlumber Lua policy hooks — shipped, not project-authored.
    "usr/share/wireplumber/**",
]
