# Flatpak manifest for biglinux-microphone (GUI configurator).
#
# The GUI is the Python front-end under app/, installed as sources into a
# private root with packaging/launcher.py as its entry point, as the Arch
# package does. The Rust binaries are the backend (cli, probe, pwloader).
# The runtime provides Python, PyGObject, pycairo and the PipeWire tools;
# numpy is added here.
# The validated reference build is packaging/arch/PKGBUILD.
#
# Local test build (source = this working tree):
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/br.com.biglinux.microphone.yml
#
# Flathub submission: replace the local `type: dir` source with a pinned
# `type: git` commit and regenerate `cargo-sources.json` from Cargo.lock.
#
# Caveats — read before publishing:
#   * Audio processing depends on host-side LADSPA plugins
#     (`gtcrn-ladspa`, `swh-plugins`) and runs through host PipeWire +
#     WirePlumber. The Flatpak ships only the configurator GUI / CLI;
#     filters live in user PipeWire/WirePlumber config under
#     `~/.config/{pipewire,wireplumber}/`.
#   * The Plasma 6 applet, systemd user units, the WirePlumber Lua
#     policy hook are host integration — not packaged here. Distro packages
#     (PKGBUILD / .deb / .rpm) remain the supported path for them.
app-id: br.com.biglinux.microphone
runtime: org.gnome.Platform
# Keep `rust-stable` aligned with the current supported GNOME branch:
# `flatpak info -m org.gnome.Sdk//<ver>`.
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for the bindgen step of pipewire-sys.
  - org.freedesktop.Sdk.Extension.llvm22
command: biglinux-microphone

finish-args:
  # Display + input
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio: PipeWire socket for the meters, probes and pw-cat/pw-record;
  # the PulseAudio socket for pactl's device list
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # PipeWire / WirePlumber configuration that the GUI writes to
  - --filesystem=xdg-config/pipewire:create
  - --filesystem=xdg-config/wireplumber:create
  # App's own settings file
  - --filesystem=xdg-config/biglinux-microphone:create
  # systemd --user control through the host bus (start/stop the helper
  # services that run the filter chain)
  - --talk-name=org.freedesktop.systemd1
  # Desktop / theme integration
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro

build-options:
  # clang on PATH gives bindgen its own builtin headers (stdbool.h).
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  env:
    CARGO_HOME: /run/build/biglinux-microphone/cargo
    RUST_BACKTRACE: '1'
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib

modules:
  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links="file://${PWD}" --prefix="${FLATPAK_DEST}" numpy
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/3a/1b/3b16a9bc514a440a7a0883684111dcb1ef1aee960af2ca95da8fc775f124/numpy-2.5.3-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: a5fa86b80fd24bcd1aff83ad23be44ea323de3f787be8f8b15d4a65621e25321
        only-arches:
          - x86_64

  - name: biglinux-microphone
    buildsystem: simple
    build-commands:
      # Backend binaries; the GUI is the Python front-end below.
      - cargo build --release --frozen --offline --no-default-features -p biglinux-microphone
      - |
        for binary in biglinux-microphone-cli biglinux-microphone-probe biglinux-microphone-pwloader; do
          install -Dm755 "target/release/${binary}" "${FLATPAK_DEST}/bin/${binary}"
        done

      # Front-end and its big_gtk_kit, in the launcher's private root.
      - |
        app_root="${FLATPAK_DEST}/lib/biglinux-microphone"
        install -d "$app_root"
        cp -a app/biglinux_microphone app/big_gtk_kit "$app_root/"
        find "$app_root" -type d -name __pycache__ -prune -exec rm -rf '{}' +
        install -Dm755 packaging/launcher.py "$app_root/launcher.py"
        ln -s ../lib/biglinux-microphone/launcher.py "${FLATPAK_DEST}/bin/biglinux-microphone"

      - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/biglinux-microphone/LICENSE"
      - install -Dm644 LICENSE-MIT "${FLATPAK_DEST}/share/licenses/biglinux-microphone/LICENSE-MIT"
      - install -Dm644 app/big_gtk_kit/LICENSE "${FLATPAK_DEST}/share/licenses/biglinux-microphone/LICENSE.big-gtk-kit"

      # Desktop entry
      - install -Dm644 usr/share/applications/br.com.biglinux.microphone.desktop
          "${FLATPAK_DEST}/share/applications/br.com.biglinux.microphone.desktop"

      # AppStream metadata (Flathub gate)
      - install -Dm644 usr/share/metainfo/br.com.biglinux.microphone.metainfo.xml
          "${FLATPAK_DEST}/share/metainfo/br.com.biglinux.microphone.metainfo.xml"

      # App icon
      - install -Dm644 usr/share/icons/hicolor/scalable/apps/br.com.biglinux.microphone.svg
          "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/br.com.biglinux.microphone.svg"

      # Status icons (used by the host Plasma applet, harmless to ship)
      - install -Dm644 usr/share/icons/hicolor/scalable/status/big-noise-reduction-on.svg
          "${FLATPAK_DEST}/share/icons/hicolor/scalable/status/big-noise-reduction-on.svg"
      - install -Dm644 usr/share/icons/hicolor/scalable/status/big-noise-reduction-off.svg
          "${FLATPAK_DEST}/share/icons/hicolor/scalable/status/big-noise-reduction-off.svg"

      # Translations: the po/LINGUAS release allowlist, as the PKGBUILD builds it.
      - |
        for lang in $(sed 's/#.*//' po/LINGUAS); do
          install -d "${FLATPAK_DEST}/share/locale/${lang}/LC_MESSAGES"
          msgfmt --check --check-format "po/${lang}.po" \
            -o "${FLATPAK_DEST}/share/locale/${lang}/LC_MESSAGES/biglinux-microphone.mo"
        done

    sources:
      - type: dir
        # Local working tree. For Flathub, swap for a `type: git` block
        # pinning the release tag and ship `cargo-sources.json` for
        # offline crate fetching.
        path: ../..
        skip:
          - target
          - .git
          - build-locale
          - packaging/arch/pkg
          - packaging/arch/src
      - cargo-sources.json
