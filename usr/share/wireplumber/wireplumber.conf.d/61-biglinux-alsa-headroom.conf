# BigLinux Microphone — modest ALSA ring-buffer headroom for the
# pwloader-hosted filter chains.
#
# Why this exists. The denoiser hosts every filter graph (mic, AEC,
# output) as a regular client of the main PipeWire daemon: each
# chain runs inside its own `biglinux-microphone-pwloader` process
# but the audio nodes are exported back to the daemon and driven by
# the daemon's data-loop. That means all chains share one clock —
# the cross-process drift that motivated the previous standalone
# `pipewire -c` worker is gone, and so is the +42 ms slack we used
# to compensate for it.
#
# What is left to absorb. Even with one shared clock, normal Linux
# desktop preemption (browser repaints, app GC pauses, brief kernel
# stalls) can starve the hw ring buffer between two ALSA period
# IRQs and trigger PipeWire's
# `spa.alsa: front:1p: follower avail:N delay:N target:T thr:T,
# resync` log line (the audible "small cuts" symptom). A small
# headroom bump keeps that from happening on consumer hardware
# without imposing perceptible latency.
#
# Per the upstream PipeWire docs (pipewire-alsa(5),
# wiki.archlinux.org/title/PipeWire#xruns), `api.alsa.headroom`
# enlarges the slack between the hardware pointer and the software
# pointer without changing the negotiated period-size or the global
# quantum.
#
# What we match. Every consumer-class ALSA device the package can
# realistically drive:
#
#   - USB capture / playback — batch hardware, USB SOF jitter alone
#     can starve the buffer.
#   - PCI/HDA built-in capture / playback — most laptops / desktops.
#   - Platform-bus codecs (I2S / SoC-attached) — ARM SBCs (Raspberry
#     Pi, RockPro, Pine), some Chromebooks repurposed as Linux
#     desktops. ALSA exposes them as `alsa_*.platform-*`.
#   - AMD ACP (Audio Co-Processor) — modern AMD Ryzen laptops route
#     the internal mic / speakers through the ACP block, which
#     surfaces as `alsa_*.acp-*` instead of `pci-*`. Same scheduling
#     stalls apply, same cushion needed.
#
# Bluetooth is handled separately by the pipewire-biglinux-config
# package (`/etc/wireplumber/wireplumber.conf.d/51-bluez-config.conf`)
# via `node.latency = "2048/48000"` — `api.alsa.headroom` does not
# apply to `bluez_*` nodes (they are not ALSA devices).
#
# What we do not match. Pro-audio interfaces want sub-5 ms
# round-trip and would be ill-served by forced headroom. A competing
# WirePlumber rule with higher `priority.session` (or a user
# node-prop override) can lower headroom on a per-device basis. The
# package targets consumer voice / video calls on stock hardware.
#
# Coexistence note. The `wireplumber` package itself ships
# `/usr/share/wireplumber/wireplumber.conf.d/alsa-vm.conf` which
# overrides headroom to 2048 / 8192 inside virtual machines (matched
# by `cpu.vm.name`). Alphabetical drop-in ordering means
# `alsa-vm.conf` loads after this file, so VM hosts get the larger
# slack and bare-metal hosts get our 1024.

monitor.alsa.rules = [
  {
    matches = [
      # USB audio (mics, headsets, webcams, USB DACs).
      { node.name = "~alsa_input.usb-.*" }
      { node.name = "~alsa_output.usb-.*" }
      # Built-in HDA / PCI (laptop speakers, motherboard analog).
      { node.name = "~alsa_input.pci-.*" }
      { node.name = "~alsa_output.pci-.*" }
      # Platform-bus codecs (ARM SBCs, repurposed Chromebooks).
      { node.name = "~alsa_input.platform-.*" }
      { node.name = "~alsa_output.platform-.*" }
      # AMD ACP (Audio Co-Processor) — modern Ryzen laptops.
      { node.name = "~alsa_input.acp-.*" }
      { node.name = "~alsa_output.acp-.*" }
    ]
    actions = {
      update-props = {
        # ~21 ms of slack at 48 kHz. Halved from the
        # standalone-daemon era (2048 frames / 42 ms): the single
        # shared clock under the pwloader architecture removes the
        # cross-process drift, so we only need enough headroom to
        # ride out short scheduling stalls. Empirically clean on
        # USB + PCI/HDA under 4+ concurrent Chromium streams and an
        # active call. The fixed +21 ms is invisible for voice/video
        # calls (the package's primary use case); pro-audio users
        # override via a higher-priority WirePlumber rule.
        api.alsa.headroom = 1024
      }
    }
  }
]
