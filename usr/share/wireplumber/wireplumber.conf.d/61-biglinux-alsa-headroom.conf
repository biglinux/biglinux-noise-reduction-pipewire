# BigLinux compatibility headroom. Preserve the previous 1024-frame rule until
# device-specific xrun/latency measurements justify a migration; it is NOT a
# universal optimum or an imperceptible end-to-end latency guarantee.
#
# PipeWire documents headroom as additional ALSA ring-buffer slack, normally 0.
# 1024 frames / 48000 Hz = 21.33 ms in that buffer; total physical latency also
# depends on direction, driver, periods, resamplers and the rest of the graph.
# USB/PCI matches include professional interfaces as well as consumer devices.
#
# For a measured per-device override, tools/headroom-override.py emits a later
# user drop-in for ONE exact node.name. It does not install it or restart audio.
# Compare 0/256/512/1024, xruns and loopback latency before retaining an override.
# Inspect other rules (including VM rules); effective properties, not filename
# assumptions alone, determine the actual configuration.

monitor.alsa.rules entry wins. A proper per-device or
# per-profile policy (e.g. keying off the Pro Audio profile) needs measurement
# on that hardware and is left as follow-up; this file stays a conservative
# consumer default. The package targets consumer voice / video calls.
#
# Coexistence note. The `wireplumber` package itself ships
# `/usr/share/wireplumber/wireplumber.conf.d/alsa-vm.conf` which
# overrides headroom to 2048 / 8192 inside virtual machines (matched
# by `cpu.vm.name`). Alphabetical drop-in ordering means
# `alsa-vm.conf` loads after this file, so VM hosts get the larger
# slack and bare-metal hosts get our 1024.

monitor.alsa.rules = [
  {
    matches = [
      # USB audio (mics, headsets, webcams, USB DACs).
      { node.name = "~alsa_input.usb-.*" }
      { node.name = "~alsa_output.usb-.*" }
      # Built-in HDA / PCI (laptop speakers, motherboard analog).
      { node.name = "~alsa_input.pci-.*" }
      { node.name = "~alsa_output.pci-.*" }
      # Platform-bus codecs (ARM SBCs, repurposed Chromebooks).
      { node.name = "~alsa_input.platform-.*" }
      { node.name = "~alsa_output.platform-.*" }
      # AMD ACP (Audio Co-Processor) — modern Ryzen laptops.
      { node.name = "~alsa_input.acp-.*" }
      { node.name = "~alsa_output.acp-.*" }
    ]
    actions = {
      update-props = {
        # Compatibility value retained; see the measurement/override note above.
        api.alsa.headroom = 1024
      }
    }
  }
]
