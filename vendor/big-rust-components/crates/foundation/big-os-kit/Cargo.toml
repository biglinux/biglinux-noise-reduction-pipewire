# SPDX-License-Identifier: MIT
[package]
name = "big-os-kit"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io (see ARCHITECTURE.md §8)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GTK-free OS/persistence/secret contracts for BigLinux Rust apps (subprocess, atomic storage, keyring)"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["subprocess", "keyring", "storage", "biglinux"]
categories = ["os", "filesystem"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
bon.workspace = true
thiserror.workspace = true
log.workspace = true
# MIME fallback for text/binary sniffing in `text_file_kind` (default features
# only — the optional GPL `tree_magic_db` feature must stay off; MIT project).
tree_magic_mini.workspace = true
# glibc-only `malloc_trim` (mem::trim_arenas) — return freed arenas to the OS.
libc.workspace = true
libsecret = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
gio = { workspace = true, optional = true }
# System libsecret keyring backend is opt-in so a consumer never silently
# links to a secret-store library it did not ask for.
[features]
default = []
libsecret-system-backend = ["dep:gio", "dep:glib", "dep:libsecret"]
# Compatibility alias for consumers that still ask for the old feature name.
secret-service-backend = ["libsecret-system-backend"]
# Compatibility feature for consumers that explicitly opt into shared HTTP
# policy. The backend uses the system curl binary and adds no Rust HTTP/TLS dep.
http-client = []
# Compatibility feature for capture-capable filtering. The backend uses the
# system v4l2-ctl command and adds no Rust V4L2/bindgen dep.
webcam-v4l2 = []
