# SPDX-License-Identifier: MIT
[package]
name = "big-jemalloc"
version = "0.1.0"
publish = false  # consumed by sibling apps via path dep, not crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Link the system jemalloc into a BigLinux GTK4 binary so its unprefixed malloc interposes the whole process (GLib included) and returns freed memory to the OS over long sessions"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["jemalloc", "allocator", "memory", "gtk", "biglinux"]
categories = ["memory-management"]
build = "build.rs"

[lib]
name = "big_jemalloc"
