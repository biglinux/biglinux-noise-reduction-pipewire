[package]
name = "biglinux-microphone"
version = "5.0.0"
edition = "2024"
authors = ["BigLinux Team <dev@biglinux.com.br>"]
license = "GPL-3.0-or-later"
description = "AI-powered microphone noise reduction with GTK4/libadwaita interface for PipeWire"
homepage = "https://github.com/biglinux/biglinux-noise-reduction-pipewire"
repository = "https://github.com/biglinux/biglinux-noise-reduction-pipewire"
rust-version = "1.97.1"
# Distro application, never published to crates.io — also lets cargo-deny's
# `allow-wildcard-paths` cover the internal `big-os-kit` path dependency.
publish = false

[lib]
name = "biglinux_microphone"
path = "src/lib.rs"

[[bin]]
name = "biglinux-microphone"
path = "src/bin/gui.rs"

[[bin]]
name = "biglinux-microphone-cli"
path = "src/bin/cli.rs"

# Long-running PipeWire client that loads a module (typically
# `libpipewire-module-filter-chain`) into its own context and stays
# alive until SIGTERM. Replaces the old `pipewire -c filter-chain.conf`
# standalone daemons so the filter graph runs as a peer of the main
# daemon — same clock, no cross-process drift.
[[bin]]
name = "biglinux-microphone-pwloader"
path = "src/bin/pwloader.rs"

[[bin]]
name = "biglinux-microphone-probe"
path = "src/bin/probe.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3

[profile.dev]
opt-level = 1

[features]
default = ["gtk-jemalloc"]
gtk-jemalloc = ["dep:big-jemalloc"]

[dependencies]
# Serialization (settings.json persistence)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# XDG directories for config/data/cache discovery
dirs = "6"

# PipeWire client — registry listening, node property inspection, live
# parameter updates (Props). libspa is re-exported by `pipewire::spa`, so
# we don't depend on it directly until the SPA POD builder for live
# parameter updates lands in a later stage.
pipewire = { version = "0.10", features = ["v1_2_0"] }

# Direct libc syscalls for the pwloader binary's real-time setup
# (sched_setaffinity for P-core pinning, mlockall, cpu_set_t, errno).
libc = "0.2"

# Cross-thread channel between the PipeWire main-loop thread and the UI
# (or CLI) consumer.
async-channel = "2"

# FFT for the spectrum analyser. `rustfft` is pure Rust, so no libffts
# FFI to worry about — and it compiles under Miri for unit tests.
rustfft = "6"

# GTK4 + libadwaita stack for the configuration GUI. Versions match the
# big-media-player project to keep the shared knowledge base consistent.
adw = { version = "0.9", features = ["v1_9"], package = "libadwaita" }
gtk = { version = "0.11", features = ["v4_22"], package = "gtk4" }
glib = "0.22"
gio = "0.22"
cairo = { version = "0.22", package = "cairo-rs" }

# gettext bindings for translating user-facing strings.
gettext-rs = { version = "0.7", features = ["gettext-system"] }

# Shared subprocess runner: argv-only spawns with concurrent stdout/stderr
# pipe draining (no >64 KiB deadlock on `pw-cli ls Node`), a kill timeout, and
# zombie reaping. Replaces the raw `std::process::Command` calls in the
# pipewire/system-audio service layer.
big-os-kit = { path = "vendor/big-rust-components/crates/foundation/big-os-kit" }

# Links the system jemalloc into the GUI binary (anchored in gui.rs main): GTK4
# returns freed memory to the OS only under jemalloc. Only the GUI bin calls
# anchor(), so the cli/pwloader bins stay on glibc.
big-jemalloc = { path = "vendor/big-rust-components/crates/foundation/big-jemalloc", optional = true }

# Shared BigLinux UI primitives — cards, slider/switch rows, preference cards,
# tooltips. The settings UI reuses these instead of app-local widget forks.
big-relm4-components = { path = "vendor/big-rust-components/crates/ui/generic/big-relm4-components" }

# Relm4 component model for the GUI shell (matches the workspace 0.11 stack).
# The microphone window is a mountable Relm4 `Component` (ADR-D14 pattern,
# shared with bigiris/players); raw gtk widgets that have no Relm4 equivalent
# (the custom-draw spectrum DrawingArea) stay embedded inside the component.
relm4 = { version = "0.11", features = ["libadwaita"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
# gettext-rs exposes its API under the `gettextrs` crate name, which
# machete's name matcher doesn't see through.
ignored = ["gettext-rs"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppress noisy pedantic lints for GTK / subprocess-heavy projects
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
wildcard_imports = "allow"
similar_names = "allow"
items_after_statements = "allow"
option_if_let_else = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

# ── Restriction lints (opt-in, high value) ────────────────────────
dbg_macro = "warn"
todo = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
verbose_file_reads = "warn"
unseparated_literal_suffix = "warn"

# ── FFI / unsafe hygiene ──────────────────────────────────────────
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "warn"

# ── Allowed after review ──────────────────────────────────────────
float_cmp = "allow"  # preset values use exact equality by design

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unreachable_code = "warn"
unreachable_patterns = "warn"
trivial_numeric_casts = "warn"
